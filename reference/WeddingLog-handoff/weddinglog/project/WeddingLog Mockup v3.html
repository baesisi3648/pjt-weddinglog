<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=1440" />
<title>WeddingLog — Order & Orders</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;1,9..144,300;1,9..144,400&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.css" rel="stylesheet">

<link rel="stylesheet" href="styles.css" />
<link rel="stylesheet" href="styles-v2.css" />
<link rel="stylesheet" href="styles-v3.css" />

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="components/OrderCheckout.jsx"></script>
<script type="text/babel" src="components/Orders.jsx"></script>

<script type="text/babel" data-presets="react">
const { useState: useStateV3, useEffect: useEffectV3 } = React;

const TWEAK_DEFAULTS_V3 = /*EDITMODE-BEGIN*/{
  "accent": "coral"
}/*EDITMODE-END*/;

const ACCENTS_V3 = {
  coral:    { name: "Coral",    primary: "#E8967C", deep: "#D2795E" },
  lavender: { name: "Lavender", primary: "#B7ABD4", deep: "#8B7CB0" },
  mint:     { name: "Mint",     primary: "#9BC2AB", deep: "#6E9E82" },
  gold:     { name: "Gold",     primary: "#D8B370", deep: "#A78441" },
};

function AppV3() {
  const [tweaks, setTweaks] = useStateV3(TWEAK_DEFAULTS_V3);
  const [editMode, setEditMode] = useStateV3(false);

  useEffectV3(() => {
    const onMsg = (e) => {
      if (!e.data) return;
      if (e.data.type === "__activate_edit_mode") setEditMode(true);
      if (e.data.type === "__deactivate_edit_mode") setEditMode(false);
    };
    window.addEventListener("message", onMsg);
    window.parent.postMessage({ type: "__edit_mode_available" }, "*");
    return () => window.removeEventListener("message", onMsg);
  }, []);

  useEffectV3(() => {
    const a = ACCENTS_V3[tweaks.accent] || ACCENTS_V3.gold;
    document.documentElement.style.setProperty("--wl-coral",   a.primary);
    document.documentElement.style.setProperty("--wl-coral-2", a.deep);
  }, [tweaks]);

  const setKey = (key, value) => {
    const next = Object.assign({}, tweaks, { [key]: value });
    setTweaks(next);
    window.parent.postMessage({ type: "__edit_mode_set_keys", edits: { [key]: value } }, "*");
  };

  return (
    <div className="wl-stage wl-stage-v2">
      <div className="wl-stage-inner">
        <header className="wl-stage-header">
          <div className="wl-stage-brand">
            <div className="wl-logo-mark">W<span className="wl-heart">♥</span></div>
            <div className="wl-stage-brand-text">
              <div className="wl-stage-brand-name">WeddingLog</div>
              <div className="wl-stage-brand-kr">웨 딩 로 그</div>
            </div>
          </div>
          <div className="wl-stage-meta">
            <strong>Order & Orders</strong>
            <div>Screen 05 · 06 — Desktop Web</div>
          </div>
        </header>

        <h1 className="wl-stage-title">
          한 권의 책을 <em>주문하고</em>,<br />
          도착할 때까지 함께 기다리기.
        </h1>
        <p className="wl-stage-sub">
          우리가 쌓은 기록을 종이 위로 옮기는 마지막 순간. 옵션을 고르고,
          제작 과정을 투명하게 확인할 수 있어요.
        </p>

        <div className="wl-mockups" data-screen-label="Mockups v3">
          <div className="wl-mockup" data-screen-label="05 Order Checkout">
            <div className="wl-mockup-label">
              <span className="wl-mockup-label-num">05</span>
              <span className="wl-mockup-label-text">Album Order · Step 2</span>
              <span className="wl-mockup-label-sub">앨범 주문 — 옵션 선택</span>
            </div>
            <OrderCheckout />
          </div>

          <div className="wl-mockup" data-screen-label="06 Orders">
            <div className="wl-mockup-label">
              <span className="wl-mockup-label-num">06</span>
              <span className="wl-mockup-label-text">My Orders</span>
              <span className="wl-mockup-label-sub">주문 관리</span>
            </div>
            <OrdersScreen />
          </div>
        </div>

        <footer className="wl-stage-footer">
          <span>WeddingLog · v0.3 mockup</span>
          <span>Fraunces · Pretendard · warm pastel system</span>
        </footer>
      </div>

      {editMode && (
        <div className="wl-tweaks">
          <div className="wl-tweaks-title">Tweaks</div>
          <div className="wl-tweaks-sub">Design adjustments</div>
          <div className="wl-tweaks-row">
            <label className="wl-tweaks-label">포인트 컬러</label>
            <div className="wl-tweaks-opts">
              {Object.entries(ACCENTS_V3).map(([k, v]) => (
                <button
                  key={k}
                  className={`wl-tweaks-swatch ${tweaks.accent === k ? "is-active" : ""}`}
                  onClick={() => setKey("accent", k)}
                >
                  <span className="sw" style={{ background: v.primary }} />
                  {v.name}
                </button>
              ))}
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<AppV3 />);
</script>
</body>
</html>
