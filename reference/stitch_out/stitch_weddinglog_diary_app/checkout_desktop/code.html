<!DOCTYPE html>

<html class="light" lang="ko"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>WeddingLog - Checkout Ritual</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&amp;family=JetBrains+Mono:wght@100..800&amp;family=Pretendard:wght@100..900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-dim": "#e2d9ca",
                        "surface": "#fff8f1",
                        "on-secondary-fixed-variant": "#474647",
                        "outline-variant": "#d7c2bd",
                        "on-secondary-fixed": "#1c1b1c",
                        "tertiary-fixed": "#ffdad3",
                        "primary": "#894f41",
                        "on-primary": "#ffffff",
                        "tertiary-container": "#ed9d8c",
                        "inverse-on-surface": "#f9f0e0",
                        "primary-fixed": "#ffdad2",
                        "surface-tint": "#894f41",
                        "on-tertiary": "#ffffff",
                        "primary-container": "#e89f8e",
                        "primary-fixed-dim": "#ffb4a3",
                        "on-secondary-container": "#636263",
                        "on-surface-variant": "#524340",
                        "on-error": "#ffffff",
                        "inverse-surface": "#353026",
                        "on-background": "#1f1b12",
                        "inverse-primary": "#ffb4a3",
                        "surface-bright": "#fff8f1",
                        "on-primary-fixed-variant": "#6d382b",
                        "on-surface": "#1f1b12",
                        "on-tertiary-fixed-variant": "#70362a",
                        "secondary-container": "#e2dfe0",
                        "surface-container-low": "#fcf2e3",
                        "tertiary-fixed-dim": "#ffb4a4",
                        "error": "#ba1a1a",
                        "secondary-fixed-dim": "#c8c6c7",
                        "surface-container": "#f6eddd",
                        "surface-container-lowest": "#ffffff",
                        "tertiary": "#8c4d3f",
                        "error-container": "#ffdad6",
                        "on-primary-container": "#693529",
                        "background": "#fff8f1",
                        "on-secondary": "#ffffff",
                        "secondary-fixed": "#e5e2e3",
                        "on-tertiary-container": "#6c3327",
                        "secondary": "#5f5e5f",
                        "on-error-container": "#93000a",
                        "surface-variant": "#ebe1d2",
                        "surface-container-highest": "#ebe1d2",
                        "on-primary-fixed": "#370e05",
                        "on-tertiary-fixed": "#390c04",
                        "surface-container-high": "#f0e7d8",
                        "outline": "#85736f",
                        "custom-bg": "#F5F0E6"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "container-max": "800px",
                        "base": "4px",
                        "md": "24px",
                        "lg": "40px",
                        "xs": "8px",
                        "sm": "16px",
                        "xl": "64px",
                        "gutter": "20px"
                    },
                    "fontFamily": {
                        "body-md": ["Pretendard"],
                        "body-sm": ["Pretendard"],
                        "display-md": ["Fraunces"],
                        "label-caps": ["Pretendard"],
                        "body-lg": ["Pretendard"],
                        "headline-sm": ["Fraunces"],
                        "display-lg": ["Fraunces"],
                        "mono-id": ["JetBrains Mono"]
                    },
                    "fontSize": {
                        "body-md": ["16px", { "lineHeight": "1.5", "fontWeight": "400" }],
                        "body-sm": ["14px", { "lineHeight": "1.4", "fontWeight": "500" }],
                        "display-md": ["32px", { "lineHeight": "1.2", "letterSpacing": "0.01em", "fontWeight": "400" }],
                        "label-caps": ["12px", { "lineHeight": "1", "letterSpacing": "0.05em", "fontWeight": "600" }],
                        "body-lg": ["18px", { "lineHeight": "1.6", "fontWeight": "400" }],
                        "headline-sm": ["24px", { "lineHeight": "1.4", "fontWeight": "500" }],
                        "display-lg": ["48px", { "lineHeight": "1.1", "letterSpacing": "0.02em", "fontWeight": "300" }],
                        "mono-id": ["13px", { "lineHeight": "1", "fontWeight": "400" }]
                    }
                }
            }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .material-symbols-outlined.fill {
            font-variation-settings: 'FILL' 1;
        }
    </style>
</head>
<body class="bg-custom-bg text-on-surface font-body-md antialiased min-h-screen flex flex-col items-center">
<!-- Top AppBar (Suppressed for Checkout as it's a linear transactional page, but keeping a minimal brand anchor) -->
<header class="w-full max-w-container-max flex justify-center py-sm mt-md mb-xl">
<span class="font-display-md text-on-surface tracking-tight">WeddingLog</span>
</header>
<main class="w-full max-w-container-max px-gutter flex-1 flex flex-col">
<!-- Stepper -->
<nav aria-label="Progress" class="mb-xl relative">
<div aria-hidden="true" class="absolute inset-y-0 left-0 w-full flex items-center">
<!-- Hairline track -->
<div class="h-[1px] w-full bg-outline-variant"></div>
</div>
<ol class="relative flex justify-between" role="list">
<!-- Step 1: Completed -->
<li>
<div class="relative flex items-center justify-center bg-custom-bg rounded-full w-8 h-8 border border-on-surface bg-on-surface z-10 shadow-sm">
<span class="material-symbols-outlined text-custom-bg text-sm font-bold">check</span>
</div>
<span class="absolute -bottom-6 left-1/2 -translate-x-1/2 font-label-caps text-on-surface whitespace-nowrap">배송 정보</span>
</li>
<!-- Step 2: Current -->
<li>
<div class="relative flex items-center justify-center bg-primary-container rounded-full w-8 h-8 border border-on-surface z-10 shadow-[0_0_0_2px_#F5F0E6_inset]">
<span class="w-2.5 h-2.5 rounded-full bg-on-surface"></span>
</div>
<span class="absolute -bottom-6 left-1/2 -translate-x-1/2 font-label-caps text-primary whitespace-nowrap">옵션 선택</span>
</li>
<!-- Step 3: Future -->
<li>
<div class="relative flex items-center justify-center bg-custom-bg rounded-full w-8 h-8 border border-outline-variant z-10">
</div>
<span class="absolute -bottom-6 left-1/2 -translate-x-1/2 font-label-caps text-outline whitespace-nowrap">결제 방식</span>
</li>
<!-- Step 4: Future -->
<li>
<div class="relative flex items-center justify-center bg-custom-bg rounded-full w-8 h-8 border border-outline-variant z-10">
</div>
<span class="absolute -bottom-6 left-1/2 -translate-x-1/2 font-label-caps text-outline whitespace-nowrap">확인</span>
</li>
</ol>
</nav>
<!-- Main Content Area: Step 2 Option Cards -->
<section class="flex flex-col gap-lg flex-1 pb-32">
<!-- Section 1: 판형 (Format) -->
<div>
<h2 class="font-headline-sm text-on-surface mb-sm">판형을 선택해주세요</h2>
<div class="grid grid-cols-2 gap-gutter">
<!-- Option A -->
<button class="relative flex flex-col p-md rounded-lg border-2 border-primary bg-surface shadow-sm text-left transition-all hover:bg-surface-dim">
<div class="flex justify-between items-start mb-4">
<span class="font-body-lg text-on-surface font-medium">정사각형</span>
<span class="material-symbols-outlined fill text-primary">check_circle</span>
</div>
<div class="w-full aspect-square bg-surface-variant rounded border border-outline-variant flex items-center justify-center mb-4 relative overflow-hidden">
<!-- Proportion Diagram -->
<div class="w-2/3 h-2/3 border border-outline bg-surface rounded-sm shadow-sm flex items-center justify-center">
<span class="font-label-caps text-outline">1:1 비율</span>
</div>
</div>
<p class="font-body-sm text-on-surface-variant">인스타그램 감성의 아담한 사이즈.</p>
<p class="font-label-caps text-outline mt-2">+0원</p>
</button>
<!-- Option B -->
<button class="relative flex flex-col p-md rounded-lg border border-outline-variant bg-surface text-left transition-all hover:bg-surface-dim">
<div class="flex justify-between items-start mb-4">
<span class="font-body-lg text-on-surface font-medium">A4 비율</span>
<span class="material-symbols-outlined text-outline-variant">radio_button_unchecked</span>
</div>
<div class="w-full aspect-square bg-surface-variant rounded border border-outline-variant flex items-center justify-center mb-4 relative overflow-hidden">
<!-- Proportion Diagram -->
<div class="w-2/3 h-[85%] border border-outline bg-surface rounded-sm shadow-sm flex items-center justify-center">
<span class="font-label-caps text-outline">세로형</span>
</div>
</div>
<p class="font-body-sm text-on-surface-variant">클래식한 앨범 느낌을 원하신다면.</p>
<p class="font-label-caps text-outline mt-2">+20,000원</p>
</button>
</div>
</div>
<hr class="border-t border-outline-variant"/>
<!-- Section 2: 표지 (Cover) -->
<div>
<h2 class="font-headline-sm text-on-surface mb-sm">표지 소재</h2>
<div class="flex gap-md">
<label class="flex items-center gap-xs cursor-pointer group">
<div class="w-5 h-5 rounded-full border border-primary flex items-center justify-center relative">
<div class="w-2.5 h-2.5 rounded-full bg-primary"></div>
</div>
<span class="font-body-md text-on-surface group-hover:text-primary transition-colors">하드 커버 (양장)</span>
</label>
<label class="flex items-center gap-xs cursor-pointer group">
<div class="w-5 h-5 rounded-full border border-outline-variant flex items-center justify-center">
</div>
<span class="font-body-md text-on-surface group-hover:text-primary transition-colors">소프트 커버</span>
</label>
</div>
</div>
<hr class="border-t border-outline-variant"/>
<!-- Section 3: 수량 (Quantity) & Price -->
<div class="flex justify-between items-end">
<div>
<h2 class="font-headline-sm text-on-surface mb-sm">수량</h2>
<div class="flex items-center gap-md">
<div class="flex items-center border border-outline-variant rounded bg-surface overflow-hidden">
<button aria-label="Decrease quantity" class="p-2 hover:bg-surface-variant transition-colors">
<span class="material-symbols-outlined text-on-surface-variant">remove</span>
</button>
<span class="w-12 text-center font-body-lg text-on-surface">1</span>
<button aria-label="Increase quantity" class="p-2 hover:bg-surface-variant transition-colors">
<span class="material-symbols-outlined text-on-surface-variant">add</span>
</button>
</div>
<p class="font-body-sm text-outline italic">1권도 충분합니다</p>
<!-- Example of active note for >= 2: <p class="font-body-sm text-primary italic">양가 부모님께도</p> -->
</div>
</div>
<div class="text-right">
<p class="font-label-caps text-outline mb-1">총 결제 예정 금액</p>
<p class="font-display-lg text-on-surface leading-none" style="font-size: 40px;">180,000원</p>
</div>
</div>
</section>
</main>
<!-- Bottom Nav Bar for Checkout (Sticky) -->
<div class="fixed bottom-0 left-0 w-full bg-surface/90 backdrop-blur-md border-t border-outline-variant py-sm px-gutter flex justify-center z-50">
<div class="w-full max-w-container-max flex justify-between items-center">
<button class="font-body-sm text-outline hover:text-on-surface transition-colors">취소</button>
<div class="flex gap-sm">
<button class="px-6 py-3 rounded-md border border-outline text-on-surface hover:bg-surface-variant transition-colors font-body-sm">
                    이전 단계
                </button>
<button class="px-8 py-3 rounded-md bg-primary text-on-primary hover:bg-primary-fixed-dim transition-colors font-body-sm shadow-sm flex items-center gap-2">
                    다음으로
                    <span class="material-symbols-outlined text-sm">arrow_forward</span>
</button>
</div>
</div>
</div>
</body></html>
