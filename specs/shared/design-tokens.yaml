version: "2.0"

description: "WeddingLog Design System — 디자인 토큰 (컬러, 타이포그래피, 간격)"

typography:
  fonts:
    display:
      family: Fraunces
      source: "https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700"
      weights: [600, 700]
      usage: "로고, 페이지 제목, 섹션 제목"

    body:
      family: Pretendard
      source: "https://cdn.jsdelivr.net/npm/pretendard@1.0.0/dist/web/static/pretendard.css"
      weights: [400, 500, 700]
      usage: "본문, 라벨, 버튼, 입력"

  sizes:
    logo: 32px
    heading_lg: 28px
    heading_md: 24px
    heading_sm: 20px
    body_lg: 16px
    body: 14px
    label: 14px
    small: 12px

  line_heights:
    tight: 1.0
    normal: 1.2
    relaxed: 1.3
    loose: 1.5
    extra_loose: 1.6

  line_height_mapping:
    display: 1.2
    heading: 1.3
    body: 1.5
    label: 1.4
    small: 1.4

colors:
  coral:
    "50": "#FFF5F2"
    "100": "#FFE6DD"
    "200": "#FFCCBB"
    "300": "#FFB3AA"
    "400": "#FF9988"
    "500": "#FF7766"  # Primary
    "600": "#FF6644"
    "700": "#FF5533"

  lavender:
    "50": "#F9F5FF"
    "100": "#F0E6FF"
    "200": "#E6CCFF"
    "300": "#DDBBFF"
    "400": "#D4AAFF"
    "500": "#CC99FF"  # Secondary
    "600": "#BB88FF"

  mint:
    "50": "#F0FFF9"
    "100": "#D9FFEF"
    "200": "#CCFFE6"
    "300": "#99FFDD"
    "400": "#66FFCC"
    "500": "#33FFBB"  # Tertiary
    "600": "#00FFAA"

  gold:
    "50": "#FFFEF0"
    "100": "#FFFCD1"
    "200": "#FFFFB3"
    "300": "#FFFD99"
    "400": "#FFFC80"
    "500": "#FFD700"  # Accent CTA
    "600": "#FFC700"

  gray:
    "50": "#F9FAFB"
    "100": "#F3F4F6"
    "200": "#E5E7EB"
    "300": "#D1D5DB"
    "400": "#9CA3AF"
    "500": "#6B7280"
    "600": "#4B5563"
    "700": "#374151"
    "800": "#1F2937"
    "900": "#111827"

  semantic:
    primary: coral-500
    accent_cta: gold-500
    secondary_warm: lavender-500
    tertiary: mint-500
    success: mint-500
    error: "#EF4444"
    warning: "#F59E0B"
    info: "#3B82F6"
    bg_default: coral-50
    bg_secondary: gray-50
    text_primary: gray-900
    text_secondary: gray-600

category_color_mapping:
  WEDDING_PHOTO:
    accent: coral-500
    light_bg: coral-100
    dark_text: coral-700

  STUDIO_DRESS_MAKEUP:
    accent: lavender-500
    light_bg: lavender-100
    dark_text: lavender-700

  VENUE:
    accent: lavender-500
    light_bg: lavender-100
    dark_text: lavender-700

  GIFT:
    accent: lavender-500
    light_bg: lavender-100
    dark_text: lavender-700

  INVITATION:
    accent: lavender-500
    light_bg: lavender-100
    dark_text: lavender-700

  REHEARSAL:
    accent: mint-500
    light_bg: mint-100
    dark_text: mint-700

  CEREMONY:
    accent: mint-500
    light_bg: mint-100
    dark_text: mint-700

  HONEYMOON:
    accent: mint-500
    light_bg: mint-100
    dark_text: mint-700

  ETC:
    accent: gray-400
    light_bg: gray-100
    dark_text: gray-700

status_colors:
  pending: gray-200
  processing: blue-200
  completed: green-200
  error: red-200

spacing:
  # Tailwind 기본값: 4px = 1 unit
  xs: 2px      # 0.5
  sm: 4px      # 1
  md: 8px      # 2
  lg: 12px     # 3
  xl: 16px     # 4
  "2xl": 24px    # 6
  "3xl": 32px    # 8
  "4xl": 48px    # 12

spacing_scale:
  padding_xs: p-1      # 4px
  padding_sm: p-2      # 8px
  padding_md: p-3      # 12px
  padding_lg: p-4      # 16px
  padding_xl: p-6      # 24px
  padding_2xl: p-8     # 32px

  gap_xs: gap-1
  gap_sm: gap-2
  gap_md: gap-3
  gap_lg: gap-4
  gap_xl: gap-6

radius:
  button: 8px          # rounded-lg
  card: 12px           # rounded-xl
  input: 8px           # rounded-lg
  modal: 16px          # rounded-2xl
  full: 9999px         # rounded-full (배지)

shadows:
  none: "none"
  sm: "0 1px 2px 0 rgba(0, 0, 0, 0.05)"
  md: "0 4px 6px -1px rgba(0, 0, 0, 0.1)"
  lg: "0 10px 15px -3px rgba(0, 0, 0, 0.1)"
  xl: "0 20px 25px -5px rgba(0, 0, 0, 0.1)"

breakpoints:
  xs: 320px
  sm: 640px
  md: 768px
  lg: 1024px
  xl: 1280px

responsive_behavior:
  mobile:
    breakpoint: "<640px"
    layout: "single-column stacked"
    grid_cols: 1
    font_size: "base (14-16px)"
    spacing: "compact (p-3, gap-2)"

  tablet:
    breakpoint: "768px-1023px"
    layout: "single or 2-column"
    grid_cols: 2
    font_size: "base"
    spacing: "normal (p-4, gap-3)"

  desktop:
    breakpoint: ">=1024px"
    layout: "multi-column"
    grid_cols: 3-4
    font_size: "lg"
    spacing: "generous (p-6, gap-4)"

transitions:
  fast: 200ms
  normal: 300ms
  slow: 500ms
  timing_function: "cubic-bezier(0.4, 0, 0.2, 1)"

accessibility:
  focus_outline: "2px solid coral-500"
  focus_outline_offset: 2px
  min_touch_target: "44px × 44px"
  color_contrast_ratio: "4.5:1 (WCAG AA)"

  focus_visible:
    outline: "2px solid"
    outline_color: coral-500
    outline_offset: 2px
    box_shadow: "0 0 0 3px rgba(255, 119, 102, 0.1)"

