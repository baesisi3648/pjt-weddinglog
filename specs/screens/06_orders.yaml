# Orders — 주문 관리, 상태 변경, ZIP 익스포트 (Lv3)

version: "2.0"

screen:
  name: 주문 관리
  route: /orders
  layout: single-column
  level: "Lv2 + Lv3"
  purpose: "생성된 모든 주문 조회, 상태 관리, 데이터 익스포트"
  design_reference: "reference/WeddingLog-handoff/weddinglog/project/components/Orders.jsx"

data_requirements:
  - resource: orders
    needs: [id, format, cover_type, quantity, status, created_at, recipient_name, total_price]
    filters: {couple_id: "?couple_id", status: "?status_filter"}
    mutations: [update_status, export_zip (Lv3)]

components:
  - id: orders_header
    type: header
    function: "주문 관리 제목, 주문 개수, 상태 필터"
    layout:
      - title: "'주문 관리' (Fraunces 28px)"
      - count: "'2개의 주문' (gray-600, Pretendard 14px)"

  - id: status_filter
    type: filter_tabs
    function: "주문 상태별 필터링 (선택)"
    options:
      - label: "전체"
        value: null
        default: true
        badge: "3"

      - label: "대기 중"
        value: pending
        badge: "1"

      - label: "진행 중"
        value: processing
        badge: "1"

      - label: "완료"
        value: completed
        badge: "1"

  - id: orders_list
    type: section
    function: "주문 카드 스택"
    layout: vertical, gap-4
    empty_state:
      - icon: "gift box icon (w-20 h-20, text-gray-300)"
      - title: "'아직 주문이 없습니다' (Pretendard 18px, bold)"
      - subtitle: "'앨범을 만들어보세요' (gray-600)"
      - link: "타임라인으로 (→ /timeline)"

    children:
      - order_card:
          - id: order_card_block
            type: card
            shadow: "shadow-md"
            padding: "p-6"
            radius: "rounded-xl"
            layout: vertical, gap-4

            content:
              - section_header:
                  - order_id:
                      - label: "'주문 ID'"
                      - value: "'ord_20261025_001' (monospace, selectable)"
                      - button_copy: "'복사' (outline, sm)"
                      - action: "click → clipboard copy → toast '복사되었습니다'"
                  - order_date:
                      - text: "'2026.04.28'"
                      - color: gray-600

              - section_status:
                  - badge: "상태 배지"
                    states:
                      - pending: "bg-gray-200 text-gray-800, '대기 중'"
                      - processing: "bg-blue-200 text-blue-800, '진행 중'"
                      - completed: "bg-green-200 text-green-800, '완료'"

              - section_summary:
                  - line: "'정사각형 하드커버 3권' (bold)"
                  - line: "'45장 선택 (예상 18페이지)' (gray-600)"

              - section_recipient:
                  - text: "'수령인: 박민준' (Pretendard 14px)"

              - section_price:
                  - text: "'총 가격: 600,000원' (Pretendard 18px, bold, coral-500)"

              - section_actions:
                  layout: "horizontal, gap-2"
                  button_1:
                    - label: "pending 상태: '진행 중으로 변경'"
                    - label: "processing 상태: '완료로 변경'"
                    - label: "completed 상태: '상태 변경 불가' (disabled, gray)"
                    - variant: "outline-coral"
                    - action: "PATCH /api/orders/{order_id}/status"
                    - on_success: "카드 업데이트, 토스트 '상태가 변경되었습니다'"

                  button_2:
                    - label: "'상세 보기' (link, blue)"
                    - action: "navigate to /orders/{order_id}"

                  button_3:
                    - label: "'데이터 다운로드' (secondary, green, Lv3)"
                    - visibility: "only if Lv3 enabled"
                    - action: "GET /api/orders/{order_id}/export"
                    - behavior: "ZIP 파일 브라우저 다운로드, 로딩 중 스피너"

order_detail_modal:
  route: "/orders/{order_id}"
  layout: single-column
  contents:
    - header:
        - back_button: "'← 뒤로' (or close icon)"
        - title: "'주문 상세' (Fraunces 28px)"

    - section_order_info:
        - field_format: "'정사각형 (21×21cm)'"
        - field_cover: "'하드커버'"
        - field_quantity: "'3권'"
        - field_price: "'총 가격: 600,000원' (bold, coral-500)"

    - section_order_status:
        - title: "'주문 상태'"
        - timeline: "pending → processing → completed"
        - current: "현재 상태 표시 (checkmark or indicator)"
        - status_date: "'2026.04.28 14:00 생성'"

    - section_album_composition:
        - title: "'앨범 구성'"
        - each_chapter:
            - name: "'웨딩촬영'"
            - count: "'8장'"

    - section_recipient_info:
        - title: "'수령인 정보'"
        - name: "'박민준'"
        - phone: "'010-1234-5678'"
        - address: "'서울시 강남구 테헤란로 123, 456호'"

    - button_export: "'데이터 다운로드' (green, Lv3)"
      action: "GET /api/orders/{order_id}/export → ZIP download"

export_zip_structure:
  level: Lv3
  endpoint: "GET /api/orders/{order_id}/export"
  filename: "order_{order_id}.zip"
  contents:
    - order.json:
        fields: "[order_id, couple, format, cover_type, quantity, chapters, recipient, total_photos, total_pages, created_at, exported_at]"
        encoding: UTF-8

    - chapters/:
        - structure: "01_wedding_photo/, 02_preparation/, 03_ceremony/, 04_honeymoon/"
        - content: "선택된 사진 파일들 (photo_{id}.jpg)"

    - captions.json:
        format: "{photo_001.jpg: {caption, date, category}}"
        encoding: UTF-8

user_flows:
  - name: "주문 목록 조회"
    steps:
      - "GET /orders 진입"
      - "모든 주문 카드 표시 (또는 필터된 상태)"
      - "각 카드에 상태 배지, 가격, 수령인 표시"

  - name: "주문 상태 변경 (시뮬레이션)"
    steps:
      - "pending 주문 카드에서 '진행 중으로 변경' 버튼 클릭"
      - "PATCH /api/orders/{order_id}/status with {new_status: 'processing'}"
      - "카드 배지 색상 변경 (gray → blue)"
      - "토스트: '상태가 변경되었습니다'"

  - name: "주문 상세 보기"
    steps:
      - "'상세 보기' 링크 클릭"
      - "/orders/{order_id}로 이동"
      - "주문의 모든 정보 표시 (구성, 배송정보, 가격, 상태)"

  - name: "데이터 익스포트 (Lv3)"
    steps:
      - "'데이터 다운로드' 버튼 클릭"
      - "로딩 스피너 표시"
      - "GET /api/orders/{order_id}/export 호출"
      - "ZIP 파일 브라우저 다운로드 시작"
      - "다운로드 폴더에 'order_{order_id}.zip' 저장"

edge_cases:
  - condition: "주문 0건"
    behavior: "빈 상태 UI (아이콘 + 메시지 + 타임라인 링크)"

  - condition: "completed 상태 주문"
    behavior: "상태 변경 버튼 비활성화 (disabled, gray), '완료된 주문입니다' 툴팁 (선택)"

  - condition: "상태 역전 시도 (예: completed → processing)"
    behavior: "API 거부 (400 Bad Request), '상태를 이전 상태로 변경할 수 없습니다' 에러"

  - condition: "ZIP 익스포트 실패"
    behavior: "에러 토스트: '다운로드에 실패했습니다. 다시 시도해주세요'"

  - condition: "대용량 주문 (100+ 사진)"
    behavior: "진행 바 표시 (선택), 진행률 업데이트 (예: '30% 준비 중')"

design_tokens:
  status_colors:
    pending: gray-200 (text: gray-800)
    processing: blue-200 (text: blue-800)
    completed: green-200 (text: green-800)

  typography:
    order_id:
      font: "Courier New (monospace)"
      weight: 500
      size: 14px

    price:
      font: Pretendard
      weight: 600
      size: 18px
      color: coral-500

  spacing:
    card_padding: p-6
    section_gap: gap-4
    action_gap: gap-2

tests:
  - name: "주문 목록 로드"
    when: "GET /orders"
    then:
      - "모든 주문 카드 표시"
      - "각 카드에 주문 ID, 상태 배지, 가격 표시"
      - "상태별 배지 색상 구분 (pending: gray, processing: blue, completed: green)"

  - name: "상태 필터 동작"
    when: "상태 필터 탭 클릭 (예: 'completed')"
    then:
      - "URL 또는 상태 업데이트 (쿼리 파라미터 또는 state)"
      - "completed 주문만 표시"
      - "배지에 개수 표시"

  - name: "상태 변경 버튼"
    when: "pending 카드의 '진행 중으로 변경' 버튼 클릭"
    then:
      - "PATCH /api/orders/{order_id}/status"
      - "배지 색상 변경 (gray → blue)"
      - "버튼 레이블 변경 ('완료로 변경')"
      - "토스트 메시지 표시"

  - name: "완료 상태 버튼 비활성화"
    when: "completed 주문 카드 표시"
    then: "상태 변경 버튼 비활성화 (disabled, gray), 클릭 불가"

  - name: "상세 보기 네비게이션"
    when: "'상세 보기' 링크 클릭"
    then:
      - "navigate to /orders/{order_id}"
      - "상세 정보 페이지 로드"
      - "뒤로 버튼으로 목록 복귀 가능"

  - name: "ZIP 다운로드 (Lv3)"
    when: "'데이터 다운로드' 버튼 클릭"
    then:
      - "로딩 스피너 표시"
      - "GET /api/orders/{order_id}/export 호출"
      - "ZIP 파일 브라우저 다운로드"
      - "파일명: order_{order_id}.zip"

